name: Deploy Admin to Cloudflare Pages

# Cloudflare Pages의 네이티브 Git 연동(GitHub 앱)을 쓰지 않는다 — 이 저장소가 조직(TrsoftKorea)
# 소속이라 그 앱을 조직에 새로 설치할 권한이 없어서, wrangler-action으로 직접 배포한다.
# 필요한 저장소 시크릿(Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN   — Account/Cloudflare Pages/Edit 권한으로 발급
#   CLOUDFLARE_ACCOUNT_ID  — Cloudflare 대시보드 우측에서 확인

on:
  push:
    branches: [main]
    paths: ['Admin~/**', '.github/workflows/admin-deploy.yml']
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Admin~/package-lock.json
      - run: npm ci
        working-directory: Admin~
      # Cloudflare 대시보드의 "환경 변수"는 여기선 안 먹는다 — 빌드가 Cloudflare가 아니라
      # 여기(GitHub Actions)에서 일어나기 때문이다. 전부 공개돼도 되는 값(README 참고).
      - run: npm run build
        working-directory: Admin~
        env:
          VITE_GOOGLE_CLIENT_ID: 782622202301-336bs6o064t4i739lcuo1e4idkh8kkt2.apps.googleusercontent.com
          VITE_DEFENCER_URL: https://wxivrmvtpufeczltward.supabase.co
          VITE_DEVILSLAYER_URL: https://owumqjyctqhuyailqutd.supabase.co
      # 첫 실행 때만 필요 — 프로젝트가 이미 있으면 에러가 나지만 그냥 넘어간다.
      - uses: cloudflare/wrangler-action@v3
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: Admin~
          command: pages project create truebase-admin --production-branch=main
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: Admin~
          command: pages deploy dist --project-name=truebase-admin
